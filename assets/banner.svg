<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Blackout Patterns</title>
  <desc id="d">Banner with a row of vertical bars that fade out on the right, like a grid load curve going dark.</desc>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55c99d" stop-opacity="0.9"/>
      <stop offset="0.62" stop-color="#2f6b55" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#1c2a24" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="#0e1613"/>

  <!-- decorative load curve: bars that thin out toward the right -->
  <g fill="url(#fade)">
    <rect x="40"  y="214" width="14" height="66"/>
    <rect x="64"  y="196" width="14" height="84"/>
    <rect x="88"  y="178" width="14" height="102"/>
    <rect x="112" y="166" width="14" height="114"/>
    <rect x="136" y="160" width="14" height="120"/>
    <rect x="160" y="154" width="14" height="126"/>
    <rect x="184" y="150" width="14" height="130"/>
    <rect x="208" y="156" width="14" height="124"/>
    <rect x="232" y="164" width="14" height="116"/>
    <rect x="256" y="172" width="14" height="108"/>
    <rect x="280" y="170" width="14" height="110"/>
    <rect x="304" y="162" width="14" height="118"/>
    <rect x="328" y="150" width="14" height="130"/>
    <rect x="352" y="132" width="14" height="148"/>
    <rect x="376" y="116" width="14" height="164"/>
    <rect x="400" y="104" width="14" height="176"/>
    <rect x="424" y="98"  width="14" height="182"/>
    <rect x="448" y="104" width="14" height="176"/>
    <rect x="472" y="122" width="14" height="158"/>
    <rect x="496" y="146" width="14" height="134"/>
    <rect x="520" y="170" width="14" height="110"/>
    <rect x="544" y="192" width="14" height="88"/>
    <rect x="568" y="206" width="14" height="74"/>
    <rect x="592" y="218" width="14" height="62"/>
  </g>
  <!-- the dark hours -->
  <g fill="#1c2a24">
    <rect x="616" y="228" width="14" height="52"/>
    <rect x="640" y="236" width="14" height="44"/>
    <rect x="664" y="242" width="14" height="38"/>
    <rect x="688" y="246" width="14" height="34"/>
    <rect x="712" y="250" width="14" height="30"/>
    <rect x="736" y="252" width="14" height="28"/>
  </g>
  <line x1="40" y1="280" x2="1160" y2="280" stroke="#2a3a33" stroke-width="2"/>

  <!-- text -->
  <circle cx="796" cy="86" r="7" fill="#ff6f7a"/>
  <text x="814" y="104" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#e3ece7" letter-spacing="-1">Blackout Patterns</text>
  <text x="796" y="142" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#93a69d">Mining the regimes, motifs and precursors of load</text>
  <text x="796" y="170" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#93a69d">shedding in Bangladesh's power grid, 2015–2026</text>
  <text x="796" y="214" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#55c99d">DATA MINING · TIME SERIES · PATTERN DISCOVERY</text>
</svg>
